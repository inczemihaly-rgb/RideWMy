<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RIDEWMY - Értékelés írása</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.1/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-purple: #635BFF;
            --primary-hover: #5046e5;
            --bg-gray: #EFEFEF;
            --card-radius: 16px;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-gray);
            color: #1f2937;
        }

        .brand-logo, .font-bagel {
            font-family: 'Bagel Fat One', cursive;
        }

        .btn-purple {
            background-color: var(--primary-purple);
            color: white;
            border-radius: 12px;
            font-weight: 600;
            border: none;
            padding: 12px;
            transition: all 0.2s;
        }

        .btn-purple:hover {
            background-color: var(--primary-hover);
            color: white;
        }

        .card-custom {
            background: #ffffff;
            border-radius: var(--card-radius);
            border: none;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
        }

        .rating-stars {
            cursor: pointer;
            font-size: 2.2rem;
            color: #E5E7EB;
            transition: color 0.15s ease-in-out;
        }

        .rating-stars .bi-star-fill.active {
            color: #FFC107;
        }

        .form-control-custom {
            background-color: #F3F4F6;
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-size: 0.95rem;
        }

        .form-control-custom:focus {
            background-color: #E5E7EB;
            box-shadow: none;
        }

        .user-pill {
            background-color: #F3F4F6;
            border-radius: 30px;
            padding: 4px 14px 4px 4px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .user-avatar-tag {
            background-color: #EDE9FE;
            color: var(--primary-purple);
            font-weight: 700;
            font-size: 0.8rem;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

    <!-- Header / Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom sticky-top py-2">
        <div class="container" style="max-width: 800px;">
            <a class="navbar-brand brand-logo fs-3 text-dark" href="/">RIDEWMY</a>
            
            <div class="d-flex align-items-center gap-3">
                <a href="/" class="nav-link fw-medium fs-6 text-muted">Utak keresése</a>
                <a href="/create-ride" class="nav-link fw-medium fs-6 text-muted">Hirdetés feladása</a>
                
                <div class="dropdown">
                    <div class="user-pill" data-bs-toggle="dropdown" aria-expanded="false">
                        <div class="user-avatar-tag">SZ</div>
                        <span class="fw-semibold small text-dark">Szilárd T.</span>
                    </div>
                    <ul class="dropdown-menu dropdown-menu-end shadow-sm border-0 mt-2">
                        <li><a class="dropdown-item" href="#"><i class="bi bi-person me-2"></i>Profilom</a></li>
                        <li><a class="dropdown-item text-danger" href="#"><i class="bi bi-box-arrow-right me-2"></i>Kijelentkezés</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>

    <!-- Értékelés Kártya -->
    <div class="container py-5" style="max-width: 520px;">
        <div class="card card-custom p-4 p-md-5 text-center">
            
            <h2 class="font-bagel display-6 fw-bold mb-1">Értékelés írása</h2>
            <p class="text-muted small mb-4">Milyen volt a közös utazásod <strong>Szilárd T.</strong> sofőrrel?</p>

            <form action="/" method="GET">
                <div class="rating-stars d-flex justify-content-center gap-2 mb-4" id="star-container">
                    <i class="bi bi-star-fill active" data-value="1"></i>
                    <i class="bi bi-star-fill active" data-value="2"></i>
                    <i class="bi bi-star-fill active" data-value="3"></i>
                    <i class="bi bi-star-fill active" data-value="4"></i>
                    <i class="bi bi-star-fill active" data-value="5"></i>
                </div>

                <input type="hidden" name="rating" id="rating-value" value="5">

                <div class="mb-4 text-start">
                    <label class="form-label small fw-medium text-secondary">Megjegyzés (opcionális)</label>
                    <textarea class="form-control form-control-custom" rows="4" placeholder="Oszd meg a tapasztalataidat a többi utassal..."></textarea>
                </div>

                <button type="submit" class="btn btn-purple w-100 fs-6">
                    Értékelés beküldése
                </button>
            </form>

        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>
    <script>
        const stars = document.querySelectorAll('#star-container .bi-star-fill');
        const ratingInput = document.getElementById('rating-value');

        stars.forEach(star => {
            star.addEventListener('click', function() {
                const selectedRating = parseInt(this.dataset.value);
                ratingInput.value = selectedRating;

                stars.forEach((s, idx) => {
                    if (idx < selectedRating) {
                        s.classList.add('active');
                    } else {
                        s.classList.remove('active');
                    }
                });
            });
        });
    </script>
</body>
</html>
