<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RIDEWMY - Út meghirdetése</title>
    
    <!-- Bootstrap 5 CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.1/font/bootstrap-icons.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-purple: #635BFF;
            --primary-hover: #5046e5;
            --bg-gray: #EFEFEF;
            --card-radius: 16px;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-gray);
            color: #1f2937;
        }

        .brand-logo, .font-bagel {
            font-family: 'Bagel Fat One', cursive;
        }

        .btn-purple {
            background-color: var(--primary-purple);
            color: white;
            border-radius: 12px;
            font-weight: 600;
            border: none;
            padding: 12px;
            transition: all 0.2s;
        }

        .btn-purple:hover {
            background-color: var(--primary-hover);
            color: white;
        }

        .card-custom {
            background: #ffffff;
            border-radius: var(--card-radius);
            border: none;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
            overflow: visible;
        }

        .form-control-custom, .form-select-custom {
            background-color: #F3F4F6;
            border: none;
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 0.95rem;
        }

        .form-control-custom:focus, .form-select-custom:focus {
            background-color: #E5E7EB;
            box-shadow: none;
        }

        .user-pill {
            background-color: #F3F4F6;
            border-radius: 30px;
            padding: 4px 14px 4px 4px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .user-avatar-tag {
            background-color: #EDE9FE;
            color: var(--primary-purple);
            font-weight: 700;
            font-size: 0.8rem;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .autocomplete-results {
            position: absolute;
            top: 105%;
            left: 0;
            right: 0;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.12);
            z-index: 1000;
            max-height: 220px;
            overflow-y: auto;
            display: none;
            padding: 4px 0;
        }

        .autocomplete-item {
            padding: 8px 14px;
            font-size: 0.85rem;
            cursor: pointer;
            color: #374151;
            transition: background 0.15s;
        }

        .autocomplete-item:hover {
            background-color: #F3F4F6;
            color: var(--primary-purple);
            font-weight: 600;
        }
    </style>
</head>
<body>

    <!-- Header / Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom sticky-top py-2">
        <div class="container" style="max-width: 800px;">
            <a class="navbar-brand brand-logo fs-3 text-dark" href="/">RIDEWMY</a>
            
            <div class="d-flex align-items-center gap-3">
                <a href="/" class="nav-link fw-medium fs-6 text-muted">Utak keresése</a>
                <a href="/create-ride" class="nav-link fw-bold text-dark fs-6">Hirdetés feladása</a>
                
                <div class="dropdown">
                    <div class="user-pill" data-bs-toggle="dropdown" aria-expanded="false">
                        <div class="user-avatar-tag">SZ</div>
                        <span class="fw-semibold small text-dark">Szilárd T.</span>
                    </div>
                    <ul class="dropdown-menu dropdown-menu-end shadow-sm border-0 mt-2">
                        <li><a class="dropdown-item" href="#"><i class="bi bi-person me-2"></i>Profilom</a></li>
                        <li><a class="dropdown-item text-danger" href="#"><i class="bi bi-box-arrow-right me-2"></i>Kijelentkezés</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>

    <!-- Fő kártya -->
    <div class="container py-5" style="max-width: 580px;">
        <div class="card card-custom p-4 p-md-5">
            
            <div class="text-center mb-4">
                <h2 class="font-bagel display-6 fw-bold mb-1">Út meghirdetése</h2>
                <p class="text-muted small">Oszd meg az utad, és utazzatok együtt!</p>
            </div>

            <form action="/create-ride" method="POST">
                <!-- Honnan mező -->
                <div class="mb-3 position-relative">
                    <label class="form-label small fw-medium text-secondary">Honnan?</label>
                    <input type="text" id="from-input" name="from" class="form-control form-control-custom" placeholder="Gépelj be egy helyszínt..." autocomplete="off" required>
                    <div id="from-results" class="autocomplete-results"></div>
                </div>

                <!-- Hová mező -->
                <div class="mb-3 position-relative">
                    <label class="form-label small fw-medium text-secondary">Hová?</label>
                    <input type="text" id="to-input" name="to" class="form-control form-control-custom" placeholder="Gépelj be egy helyszínt..." autocomplete="off" required>
                    <div id="to-results" class="autocomplete-results"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-medium text-secondary">Dátum és idő</label>
                    <input type="datetime-local" name="datetime" class="form-control form-control-custom" value="2026-10-25T08:00" required>
                </div>

                <div class="row g-3 mb-4">
                    <div class="col-6">
                        <label class="form-label small fw-medium text-secondary">Szabad helyek száma</label>
                        <select name="seats" class="form-select form-select-custom">
                            <option value="1">1 hely</option>
                            <option value="2" selected>2 hely</option>
                            <option value="3">3 hely</option>
                            <option value="4">4 hely</option>
                        </select>
                    </div>
                    <div class="col-6">
                        <label class="form-label small fw-medium text-secondary">Ár / fő (RON)</label>
                        <input type="number" name="price" class="form-control form-control-custom" value="35" min="5" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-purple w-100 fs-6 mb-2">
                    Hirdetés közzététele
                </button>

                <div class="text-center">
                    <small class="text-muted" style="font-size: 0.75rem;">
                        A hirdetés közzétételével elfogadod a felhasználási feltételeket.
                    </small>
                </div>
            </form>

        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>
    <script>
        const popularCities = [
            { name: "Marosvásárhely", alt: ["marosvasarhely", "targu mures", "targu-mures"] },
            { name: "Kolozsvár", alt: ["kolozsvar", "cluj", "cluj-napoca"] },
            { name: "Brassó", alt: ["brasso", "brasov"] },
            { name: "Nagyszeben", alt: ["nagyszeben", "sibiu"] },
            { name: "Sepsiszentgyörgy", alt: ["sepsiszentgyorgy", "sfantu gheorghe"] },
            { name: "Székelyudvarhely", alt: ["szekelyudvarhely", "odorheiu secuiesc"] },
            { name: "Csíkszereda", alt: ["csikszereda", "miercurea ciuc"] },
            { name: "Gyergyószentmiklós", alt: ["gyergyoszentmiklos", "gheorgheni"] },
            { name: "Kézdivásárhely", alt: ["kezdivasarhely", "targu secuiesc"] },
            { name: "Nagyvárad", alt: ["nagyvarad", "oradea"] },
            { name: "Arad", alt: ["arad"] },
            { name: "Temesvár", alt: ["temesvar", "timisoara"] },
            { name: "Bukarest", alt: ["bukarest", "bucuresti"] }
        ];

        function normalizeText(text) {
            return text ? text.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase() : "";
        }

        function setupFastAutocomplete(inputId, resultsId) {
            const input = document.getElementById(inputId);
            const resultsDiv = document.getElementById(resultsId);
            let apiTimeout = null;

            input.addEventListener('input', function() {
                clearTimeout(apiTimeout);
                const queryRaw = this.value.trim();
                const queryNorm = normalizeText(queryRaw);

                if (queryNorm.length < 1) {
                    resultsDiv.style.display = 'none';
                    return;
                }

                const localMatches = popularCities.filter(c => {
                    const nameNorm = normalizeText(c.name);
                    const matchName = nameNorm.includes(queryNorm);
                    const matchAlt = c.alt.some(a => normalizeText(a).includes(queryNorm));
                    return matchName || matchAlt;
                });

                resultsDiv.innerHTML = '';

                localMatches.forEach(item => {
                    const itemDiv = document.createElement('div');
                    itemDiv.className = 'autocomplete-item';
                    itemDiv.innerHTML = `<i class="bi bi-geo-alt me-2 text-primary"></i><strong>${item.name}</strong>`;
                    itemDiv.addEventListener('click', function() {
                        input.value = item.name;
                        resultsDiv.style.display = 'none';
                    });
                    resultsDiv.appendChild(itemDiv);
                });

                if (localMatches.length > 0) {
                    resultsDiv.style.display = 'block';
                }

                if (queryNorm.length >= 3) {
                    apiTimeout = setTimeout(() => {
                        fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(queryRaw)}&countrycodes=ro&addressdetails=1&limit=5`)
                            .then(res => res.json())
                            .then(data => {
                                data.forEach(apiItem => {
                                    const cityName = apiItem.address.city || apiItem.address.town || apiItem.address.village || apiItem.name;
                                    const alreadyListed = localMatches.some(m => normalizeText(m.name) === normalizeText(cityName));
                                    if (!alreadyListed && cityName) {
                                        const itemDiv = document.createElement('div');
                                        itemDiv.className = 'autocomplete-item';
                                        itemDiv.innerHTML = `<i class="bi bi-geo-alt me-2 text-muted"></i><strong>${cityName}</strong>`;
                                        itemDiv.addEventListener('click', function() {
                                            input.value = cityName;
                                            resultsDiv.style.display = 'none';
                                        });
                                        resultsDiv.appendChild(itemDiv);
                                    }
                                });
                                if (resultsDiv.children.length > 0) {
                                    resultsDiv.style.display = 'block';
                                }
                            })
                            .catch(() => {});
                    }, 200);
                }
            });

            document.addEventListener('click', function(e) {
                if (!input.contains(e.target) && !resultsDiv.contains(e.target)) {
                    resultsDiv.style.display = 'none';
                }
            });
        }

        setupFastAutocomplete('from-input', 'from-results');
        setupFastAutocomplete('to-input', 'to-results');
    </script>
</body>
</html>
